# Render Infrastructure-as-Code Blueprint
# Automatically provisions PostgreSQL, Redis, FastAPI Backend, and React Frontend (100% FREE TIER)

services:
  # 1. FastAPI Backend Web Service (Free Tier)
  - type: web
    name: ticket-backend
    env: python
    plan: free
    region: singapore
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ticket-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ticket-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

  # 2. React Frontend Static Site (Free Global CDN)
  - type: web
    name: ticket-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: ticket-backend
          property: host

  # 3. Redis Cache Service (Free Tier)
  - type: redis
    name: ticket-redis
    region: singapore
    plan: free
    ipAllowList: []

# Managed PostgreSQL Database (Free Tier)
databases:
  - name: ticket-postgres
    databaseName: ticket_booking_db
    user: ticket_user
    plan: free
    region: singapore
